apiVersion: apps/v1
kind: Deployment
metadata:
  name: factorio-web
  namespace: factorio-system
  labels:
    app: factorio-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: factorio-web
  template:
    metadata:
      labels:
        app: factorio-web
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: factorio-web:dev
          imagePullPolicy: IfNotPresent
          env:
            # The Next server proxies /api/* to this service.
            - name: API_INTERNAL_URL
              value: http://factorio-api:3001
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: factorio-auth
                  key: api-token
            - name: WEB_AUTH_USER
              valueFrom:
                secretKeyRef:
                  name: factorio-auth
                  key: web-user
            - name: WEB_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: factorio-auth
                  key: web-password
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: 0.0.0.0
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/apps/web/.next/cache
      volumes:
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: factorio-web
  namespace: factorio-system
  labels:
    app: factorio-web
spec:
  selector:
    app: factorio-web
  ports:
    - name: http
      port: 3000
      targetPort: http
