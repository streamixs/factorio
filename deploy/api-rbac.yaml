apiVersion: v1
kind: ServiceAccount
metadata:
  name: factorio-api
  namespace: factorio-system
---
# The API operates on FactorioServer resources in this namespace. Change the
# namespace here and in FACTORIO_NAMESPACE (api.yaml) to target another one.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: factorio-api
  namespace: default
rules:
  - apiGroups:
      - games.dev.streamixs.com
    resources:
      - factorioservers
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - games.dev.streamixs.com
    resources:
      - factoriooperations
    verbs:
      - get
      - list
      - watch
      - create
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - list
  - apiGroups:
      - ""
    resources:
      - pods/log
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - list
  - apiGroups:
      - ""
    resources:
      - services
    verbs:
      - get
  - apiGroups:
      - metrics.k8s.io
    resources:
      - pods
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: factorio-api-nodes
rules:
  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: factorio-api-nodes
subjects:
  - kind: ServiceAccount
    name: factorio-api
    namespace: factorio-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: factorio-api-nodes
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: factorio-api
  namespace: default
subjects:
  - kind: ServiceAccount
    name: factorio-api
    namespace: factorio-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: factorio-api
