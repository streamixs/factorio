apiVersion: v1
kind: ServiceAccount
metadata:
  name: factorio-api
  namespace: factorio-system
---
# The API operates on FactorioServer resources in this namespace. Change the
# namespace here and in FACTORIO_NAMESPACE (api.yaml) to target another one.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: factorio-api
  namespace: default
rules:
  - apiGroups:
      - games.dev.streamixs.com
    resources:
      - factorioservers
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - list
  - apiGroups:
      - ""
    resources:
      - pods/log
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - list
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - create
      - get
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: factorio-api
  namespace: default
subjects:
  - kind: ServiceAccount
    name: factorio-api
    namespace: factorio-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: factorio-api
