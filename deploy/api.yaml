apiVersion: apps/v1
kind: Deployment
metadata:
  name: factorio-api
  namespace: factorio-system
  labels:
    app: factorio-api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: factorio-api
  template:
    metadata:
      labels:
        app: factorio-api
    spec:
      serviceAccountName: factorio-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: factorio-api:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: FACTORIO_NAMESPACE
              value: default
            - name: API_INTERNAL_URL
              value: http://factorio-api.factorio-system.svc.cluster.local:3001
            - name: FACTORIO_IMPORT_DIR
              value: /var/lib/factorio/imports
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: factorio-auth
                  key: api-token
            - name: PORT
              value: "3001"
          ports:
            - name: http
              containerPort: 3001
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: imports
              mountPath: /var/lib/factorio/imports
      volumes:
        - name: tmp
          emptyDir: {}
        - name: imports
          persistentVolumeClaim:
            claimName: factorio-api-imports
---
apiVersion: v1
kind: Service
metadata:
  name: factorio-api
  namespace: factorio-system
  labels:
    app: factorio-api
spec:
  selector:
    app: factorio-api
  ports:
    - name: http
      port: 3001
      targetPort: http
