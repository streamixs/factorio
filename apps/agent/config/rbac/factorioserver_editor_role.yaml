# This rule is not used by the project agent itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the games.dev.streamixs.com.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: agent
    app.kubernetes.io/managed-by: kustomize
  name: factorioserver-editor-role
rules:
- apiGroups:
  - games.dev.streamixs.com
  resources:
  - factorioservers
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - games.dev.streamixs.com
  resources:
  - factorioservers/status
  verbs:
  - get
