apiVersion: games.dev.streamixs.com/v1alpha1
kind: FactorioServer
metadata:
  labels:
    app.kubernetes.io/name: agent
    app.kubernetes.io/managed-by: kustomize
  name: factorioserver-sample
spec:
  version: 2.1.0
  server:
    identity:
      name: "My Factorio Server"
    access:
      maxPlayers: 10
  mapGenSettings:
    terrainSegmentation: normal
    water: normal
    seed: 123456
    autoplaceControls:
      coal:
        frequency: high
        size: normal
        richness: normal
  mapSettings:
    enemyEvolution:
      enabled: true
      timeFactor: 0.000004
