version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      pnpm-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # Nest CLI needs the TypeScript compiler API, which TS 7 does not expose
    # until 7.1. Revisit when the toolchain supports it.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: gomod
    directory: /apps/agent
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      go-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/web
      - /apps/agent
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      docker:
        patterns: ["*"]
