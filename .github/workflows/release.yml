name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check VERSION matches the tag
        run: test "$(cat VERSION)" = "${GITHUB_REF_NAME#v}"

  build:
    name: Publish ${{ matrix.name }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: .
            file: apps/api/Dockerfile
            version_arg: APP_VERSION
          - name: web
            context: .
            file: apps/web/Dockerfile
            version_arg: APP_VERSION
          - name: agent
            context: apps/agent
            file: apps/agent/Dockerfile
            version_arg: VERSION
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/factorio-${{ matrix.name }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.version_arg }}=${{ github.ref_name }}
          cache-from: type=gha,scope=release-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.name }}

  verify-images:
    name: Verify published images
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the agent version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          image="ghcr.io/${{ github.repository_owner }}/factorio-agent:${TAG}"
          test "$(docker run --rm "$image" --version)" = "$TAG"

      - name: Verify multi-arch manifests
        env:
          TAG: ${{ github.ref_name }}
        run: |
          for name in api web agent; do
            image="ghcr.io/${{ github.repository_owner }}/factorio-${name}:${TAG}"
            for platform in linux/amd64 linux/arm64; do
              docker buildx imagetools inspect "$image" | grep -q "$platform"
            done
          done

  release:
    name: Create GitHub release
    needs: [build, verify-images]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.1.0
        with:
          go-version-file: apps/agent/go.mod
          cache-dependency-path: apps/agent/go.sum

      - name: Build agent installer
        run: make -C apps/agent build-installer IMG=ghcr.io/${{ github.repository_owner }}/factorio-agent:${{ github.ref_name }}

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" apps/agent/dist/install.yaml --clobber
          else
            gh release create "$GITHUB_REF_NAME" apps/agent/dist/install.yaml \
              --title "Factorio Platform $GITHUB_REF_NAME" \
              --generate-notes
          fi
