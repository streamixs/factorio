name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check conventional commit title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|test|ci|chore|refactor|perf)(\([a-z0-9._-]+\))?: .+$'
          if [[ ! "$TITLE" =~ $pattern ]]; then
            echo "::error::PR title must follow Conventional Commits, e.g. 'feat(api): add endpoint'."
            exit 1
          fi

  workflows:
    name: Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@v6.3.0
        with:
          go-version-file: apps/agent/go.mod
          cache-dependency-path: apps/agent/go.sum

      - name: Lint workflows
        working-directory: apps/agent
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -color ../../.github/workflows/*.yml

  agent-lint:
    name: Agent lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
    defaults:
      run:
        working-directory: apps/agent
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@v6.3.0
        with:
          go-version-file: apps/agent/go.mod
          cache-dependency-path: apps/agent/go.sum

      - name: Restore agent lint tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/agent/bin
          key: agent-lint-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/agent/go.mod', 'apps/agent/go.sum', 'apps/agent/Makefile', 'apps/agent/.custom-gcl.yml') }}
          restore-keys: |
            agent-lint-tools-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore Go build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: agent-lint-go-build-${{ runner.os }}-${{ hashFiles('apps/agent/go.mod', 'apps/agent/go.sum') }}
          restore-keys: |
            agent-lint-go-build-${{ runner.os }}-

      - name: Verify linter configuration
        run: make lint-config

      - name: Lint
        run: make lint

  agent-test:
    name: Agent test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
    defaults:
      run:
        working-directory: apps/agent
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@v6.3.0
        with:
          go-version-file: apps/agent/go.mod
          cache-dependency-path: apps/agent/go.sum

      - name: Restore agent test tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/agent/bin
          key: agent-test-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/agent/go.mod', 'apps/agent/go.sum', 'apps/agent/Makefile', 'apps/agent/.custom-gcl.yml') }}
          restore-keys: |
            agent-test-tools-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore Go build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: agent-test-go-build-${{ runner.os }}-${{ hashFiles('apps/agent/go.mod', 'apps/agent/go.sum') }}
          restore-keys: |
            agent-test-go-build-${{ runner.os }}-

      - name: Test
        run: make test

      - name: Check generated files
        working-directory: .
        run: git diff --exit-code

  api:
    name: API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.28.5

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @factorio/shared build

      - name: Check formatting
        run: pnpm --filter @factorio/api format:check

      - name: Lint
        run: pnpm --filter @factorio/api lint

      - name: Test
        run: pnpm --filter @factorio/api test

      - name: Build
        run: pnpm --filter @factorio/api build

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.28.5

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @factorio/shared build

      - name: Lint
        run: pnpm --filter @factorio/web lint

      - name: Test
        run: pnpm --filter @factorio/web test

      - name: Generate Next.js types
        run: pnpm --filter @factorio/web exec next typegen

      - name: Typecheck
        run: pnpm --filter @factorio/web exec tsc --noEmit

      - name: Build
        run: pnpm --filter @factorio/web build

  docker:
    name: Docker (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: .
            file: apps/api/Dockerfile
          - name: web
            context: .
            file: apps/web/Dockerfile
          - name: agent
            context: apps/agent
            file: apps/agent/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          load: false
          tags: factorio-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
