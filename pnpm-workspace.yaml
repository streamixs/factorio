packages:
  - "apps/*"
  - "libs/*"
allowBuilds:
  sharp: false
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@hookform/resolvers@7.0.3'
  - '@shadcn/registry@0.2.2'
  - shadcn@4.23.1
# Security patches for transitive dependencies. Keep these until the parent
# packages raise their own minimum versions.
overrides:
  body-parser@^2.3.0: ^2.4.0
  fast-uri@^3.1.8: ^3.1.9
  qs@^6.16.0: ^6.16.1
